# Example music preset — reusable generation recipe.
#
# Instrumental music via ACE-Step 1.5. Metadata only; the generated audio is
# written to the profile library at generation time.

name = "cave-ambience-loop"
kind = "music"
model = "ace_step"                # ACE-Step 1.5 (see config/gaf.toml [models])
prompt = "dark ambient cave drone, low rumble, sparse atmospheric pads, seamless loop"
duration_s = 24.0
seed = 0
tags = ["ambient", "cave", "loop", "background"]
# Loop-friendly: aim for a clean, seamless 24s loop.
loop = { enabled = true, crossfade_s = 1.0 }
post = { normalize = true, denoise = false, loudness_target_lufs = -18.0 }
