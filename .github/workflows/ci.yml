name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used by this workflow. It must not require any.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Validate configuration files -------------------------------------
  config:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check TOML files parse
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.toml"):
              if ".git" in p.parts:
                  continue
              try:
                  with open(p, "rb") as f:
                      tomllib.load(f)
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("Invalid TOML files:\n" + "\n".join(bad))
              sys.exit(1)
          print("All TOML files parse OK")
          PY

  # --- Secret scan (fail on tokens / credentials / paths) ---------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Repo hygiene: no weights / large audio / machine paths -----------
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no model weights or audio are tracked
        run: |
          if git ls-files | grep -Ei '\.(gguf|ggml|safetensors|ckpt|bin|onnx|wav|flac|mp3|ogg|m4a|aiff|opus)$'; then
            echo "ERROR: model weights or audio files are tracked in git"
            exit 1
          fi
          echo "No weights/audio tracked"
      - name: Ensure no machine-specific absolute paths in tracked files
        run: |
          # Flag common home-directory leaks in tracked text files.
          if git ls-files -z | xargs -0 grep -lE '/home/[a-z0-9_-]+/' 2>/dev/null; then
            echo "ERROR: tracked files contain absolute home paths"
            exit 1
          fi
          echo "No home paths in tracked files"

  # --- Lint + unit tests ------------------------------------------------
  # The C++ build and unit tests are added in Milestone 2 when the first
  # source lands. Until then this job runs the CPU-only test skeleton.
  test:
    name: Test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test skeleton
        run: |
          # Placeholder: real CMake build + ctest arrive in Milestone 2.
          if [ -f CMakeLists.txt ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja
            cmake --build build -j
            ctest --test-dir build --output-on-failure
          else
            echo "No CMakeLists.txt yet (Milestone 1) — skipping build."
          fi
