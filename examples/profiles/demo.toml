# Example project profile.
#
# A profile is an independent project scope: its own library + settings,
# sharing the global model cache. One profile per game or client.
#
# Shipped examples live in /examples. Real profiles live in the XDG data dir
# under projects/. This file is a template, not an active profile.

name = "demo"
description = "Example profile — a small demo game audio project."

[library]
# Where this profile's audio lives (relative to the data dir).
path = "libraries/demo"
# Default kind filter for browsing.
kinds = ["sfx", "music", "loop"]

[defaults]
# Generation defaults for this profile (override preset values).
sample_rate = 48000
bit_depth = 16
loudness_target_lufs = -16.0

[export]
# Engine-agnostic export defaults for this profile.
format = "wav"
target = "defold"
# Defold-specific mapping (M4).
[export.defold]
# Defold expects 16-bit PCM WAV; sample rate per asset.
sample_rate = 48000
bit_depth = 16
# Optional: strip the project prefix from exported filenames.
strip_prefix = true
